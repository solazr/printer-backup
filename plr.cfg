[save_variables]
filename: /usr/data/printer_data/config/variables.cfg

[power_loss_recovery]
debug_mode: False
save_interval: 30
save_on_layer: True
history_size: 3
save_delay: 2

[gcode_macro ALL_PREPARE_PLR]
description: Prepares and heats the printer before resuming after power loss
gcode:
    {% set sv = printer.save_variables.variables %}
    {% if sv.plr_protected %}

        {% set target_bed = sv.plr_target_bed | default(0) | float %}
        {% set target_extruder = sv.plr_target_extruder | default(0) | float %}
        {% set last_x = sv.plr_last_x | default(0) | float %}
        {% set last_y = sv.plr_last_y | default(0) | float %}
        {% set last_z = sv.plr_last_z | default(0) | float %}
        
        {action_respond_info("PLR: Power Loss Recovery detected! Heating bed...")}

        M140 S{target_bed}
        M190 S{target_bed}
        
        {action_respond_info("PLR: Heating nozzle...")}
        M104 S{target_extruder}
        M109 S{target_extruder}

        {action_respond_info("PLR: Homing X and Y axes safely...")}
        G28 X Y

        G90 
        {action_respond_info("PLR: Moving toolhead back to crash coordinates...")}
        G1 Z{last_z + 2.0} F3000       
        G1 X{last_x} Y{last_y} F6000   
        G1 Z{last_z} F1500             
        
        SAVE_VARIABLE VARIABLE=plr_protected VALUE=0
        {action_respond_info("PLR: Handing print back to virtual SD card. Resuming...")}
        RESUME
    {% else %}
        {action_respond_info("PLR: No active power loss data found.")}
    {% endif %}