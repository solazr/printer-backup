[save_variables]
filename: /usr/data/printer_data/config/variables.cfg

[power_loss_recovery]
debug_mode: False
save_interval: 30
save_on_layer: True
history_size: 3
save_delay: 2

[gcode_macro RESUME]
description: Resume the print from a standard pause or a PLR crash event
rename_existing: RESUME_BASE
gcode:
    {% set sv = printer.save_variables.variables %}

    {% if sv.plr_protected and sv.plr_crash_detected|default(0)|int == 1 %}
        {action_respond_info("PLR: Power loss recovery active! Starting safe heat and home...")}

        {% set target_bed = sv.plr_target_bed | default(0) | float %}
        {% set target_extruder = sv.plr_target_extruder | default(0) | float %}
        {% set last_x = sv.plr_last_x | default(0) | float %}
        {% set last_y = sv.plr_last_y | default(0) | float %}
        {% set last_z = sv.plr_last_z | default(0) | float %}

        M140 S{target_bed}
        M190 S{target_bed}
        M104 S{target_extruder}
        M109 S{target_extruder}

        G28 X Y

        G90
        G1 Z{last_z + 2.0} F3000
        G1 X{last_x} Y{last_y} F6000
        G1 Z{last_z} F1500

        SAVE_VARIABLE VARIABLE=plr_crash_detected VALUE=0
        SAVE_VARIABLE VARIABLE=plr_protected VALUE=0
        {action_respond_info("PLR: Re-aligned. Handing off to virtual SD card to print...")}
        RESUME_BASE
        
    {% else %}
        {% set E = printer["gcode_macro PAUSE"].extrude|float %}
        {% if printer.extruder.can_extrude|lower == 'true' %}
            G91
            G1 E{E} F2100
            G90
        {% endif %}
        RESUME_BASE
    {% endif %}