[save_variables]
filename: /usr/data/printer_data/config/variables.cfg

[power_loss_recovery]
debug_mode: False
save_interval: 30
save_on_layer: True
history_size: 3
save_delay: 2

pin_stepper_z: !PA7 


[gcode_macro _PLR_VARIABLES]
variable_plr_flag: 0
gcode:

[gcode_macro RESUME_PRINT_PLR]
description: Resume the print after a power failure detection
gcode:
    {% set sv = printer.save_variables.variables %}
    {% if sv.plr_protected %}
        {% set target_bed = sv.plr_target_bed | float %}
        {% set target_extruder = sv.plr_target_extruder | float %}
        {% set last_x = sv.plr_last_x | float %}
        {% set last_y = sv.plr_last_y | float %}
        {% set last_z = sv.plr_last_z | float %}
        {% set last_e = sv.plr_last_e | float %}
        {% set last_f = sv.plr_last_f | float %}
        
        RESPOND MSG="Power Loss Recovery initiated. Heating up..."
        
        M140 S{target_bed}
        M104 S{target_extruder}
        M190 S{target_bed}
        M109 S{target_extruder}
        
        G28 X Y
        
        G90
        G1 Z{last_z + 2.0} F3000
        G1 X{last_x} Y{last_y} F{last_f}
        G1 Z{last_z} F1500

        G92 E{last_e}
        
        RESPOND MSG="Resuming print job from layer crash point."
        _RECOVER_PRINT_COMMAND
    {% else %}
        RESPOND MSG="No valid Power Loss Recovery data found."
    {% endif %}

[gcode_macro _RECOVER_PRINT_COMMAND]
gcode:
    SAVE_VARIABLE VARIABLE=plr_protected VALUE=0
    RESUME